# Render Blueprint for the VeriTape backend. Deploy via the Render
# dashboard's "New +" -> "Blueprint", pointed at this repo -- it reads this
# file and provisions the service below. (You can also configure the same
# settings by hand under "New +" -> "Web Service" if you'd rather not use a
# Blueprint; the values to enter are exactly the ones here.)
services:
  - type: web
    name: veritape-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # `python -m uvicorn`, not a bare `uvicorn` command: this keeps the repo
    # root -- and with it, the top-level `demo` module that api/main.py and
    # review/decisions.py both import from -- on sys.path, exactly like every
    # `python -m loan_intelligence.<module>` invocation in this repo already
    # relies on (see api/main.py's own docstring and the root README).
    startCommand: python -m uvicorn loan_intelligence.api.main:app --host 0.0.0.0 --port $PORT
    # /health returns 200 immediately, independent of the background demo-
    # portfolio seed (bootstrap.py) -- Render's port scan and this health
    # check both need to know the process is up, not whether seeding has
    # finished yet (data routes report that themselves via a 503).
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Without this, Python fully block-buffers stdout whenever it isn't
      # attached to a terminal -- exactly Render's log setup -- so print()
      # output (progress lines, even a traceback) can sit in an internal
      # buffer and never reach the log tail. This is what actually made an
      # earlier seed failure look like silence instead of an error.
      - key: PYTHONUNBUFFERED
        value: "1"
      # Required for live LLM reviewer narration (loan_intelligence/review/narrate.py).
      # Set the real value in the Render dashboard -- never commit it here.
      # Without it, narration falls back to a labeled deterministic template;
      # the rest of the pipeline is unaffected either way.
      - key: GOOGLE_API_KEY
        sync: false
      # Cold-boot seeding (loan_intelligence/bootstrap.py) -- how many
      # synthetic loans and audit-trail entries to generate on a fresh
      # container disk. Kept small on purpose: Render's free tier is 0.1
      # CPU/512MB, and the deployed instance's job is to prove the pipeline
      # runs live, not to match the full 5,000-loan numbers already in the
      # README/demo video.
      - key: SEED_LOAN_COUNT
        value: "100"
      - key: VERITAPE_SEED_AUDIT_BATCH
        value: "20"
